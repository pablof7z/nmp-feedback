[package]
name = "nmp-feedback"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reusable NMP feedback module for project-scoped Nostr feedback threads."
repository = "https://github.com/pablof7z/nmp-feedback"

[dependencies]
nmp-core = { version = "0.2.7", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "e1d502de898b53d85b1f9be52f34cee657f2c278" }
nmp-ffi = { version = "0.2.7", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "e1d502de898b53d85b1f9be52f34cee657f2c278", features = ["signer-broker"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
nmp-core = { version = "0.2.7", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "e1d502de898b53d85b1f9be52f34cee657f2c278", features = ["test-support"] }
nmp-ffi = { version = "0.2.7", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "e1d502de898b53d85b1f9be52f34cee657f2c278", features = ["test-support", "signer-broker"] }
