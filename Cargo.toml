[package]
name = "nmp-feedback"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reusable NMP feedback module for project-scoped Nostr feedback threads."
repository = "https://github.com/pablof7z/nmp-feedback"

[features]
default = ["nmp"]
nmp = ["dep:nmp-core", "dep:nmp-ffi"]

[dependencies]
nmp-core = { version = "0.4.0", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "e0c329d157a0bb039cc847f99a2c1e60dce42fce", optional = true }
nmp-ffi = { version = "0.4.0", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "e0c329d157a0bb039cc847f99a2c1e60dce42fce", features = ["signer-broker"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
