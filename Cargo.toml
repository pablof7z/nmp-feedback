[package]
name = "nmp-feedback"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reusable NMP feedback module for project-scoped Nostr feedback threads."
repository = "https://github.com/pablof7z/nmp-feedback"

[dependencies]
nmp-core = { version = "0.2.9", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "104c3f76426fbb7c2456c957da960b08c659b21b" }
nmp-ffi = { version = "0.2.9", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "104c3f76426fbb7c2456c957da960b08c659b21b", features = ["signer-broker"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
nmp-core = { version = "0.2.9", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "104c3f76426fbb7c2456c957da960b08c659b21b", features = ["test-support"] }
nmp-ffi = { version = "0.2.9", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "104c3f76426fbb7c2456c957da960b08c659b21b", features = ["test-support", "signer-broker"] }
