[package]
name = "nmp-feedback"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reusable NMP feedback module for project-scoped Nostr feedback threads."
repository = "https://github.com/pablof7z/nmp-feedback"

[features]
default = ["nmp"]
nmp = ["dep:nmp-core", "dep:nmp-ffi"]

[dependencies]
nmp-core = { version = "0.7.0", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "ce0097cdeca14cab19d5983ff5277ce4cb6f8b92", optional = true }
nmp-ffi = { version = "0.7.0", git = "https://github.com/pablof7z/nostr-multi-platform.git", rev = "ce0097cdeca14cab19d5983ff5277ce4cb6f8b92", features = ["signer-broker"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
